name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:shared
      - run: pnpm test:web
      - run: pnpm test:contract

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:hooks
      # PocketBase efêmero usado pela suíte (binário não versionado).
      - name: Baixar PocketBase 0.23.7
        run: |
          wget -q https://github.com/pocketbase/pocketbase/releases/download/v0.23.7/pocketbase_0.23.7_linux_amd64.zip -O /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d apps/pocketbase
          chmod +x apps/pocketbase/pocketbase
      - run: pnpm --filter @ml/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  pb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:hooks
      - name: Baixar PocketBase 0.23.7
        run: |
          wget -q https://github.com/pocketbase/pocketbase/releases/download/v0.23.7/pocketbase_0.23.7_linux_amd64.zip -O /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d apps/pocketbase
          chmod +x apps/pocketbase/pocketbase
      - run: pnpm test:pb
